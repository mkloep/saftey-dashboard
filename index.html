<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHI Safety Dashboard</title><style>:root{--g:#00ff6a;}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at center,#183040 0%,#081018 70%);color:#fff}body:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:80px 80px}.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2400px;opacity:.15;filter:grayscale(100%);z-index:0}.header{position:absolute;left:50px;top:30px;z-index:2}.header h1{margin:0;font-size:60px}.header p{margin:8px 0;color:#b8c7d6;font-size:24px}.clock{position:absolute;right:50px;top:40px;font-size:42px;z-index:2}.main{height:100vh;display:grid;grid-template-columns:68% 32%;position:relative;z-index:2}.left{display:flex;justify-content:center;align-items:center}.ring{width:1200px;height:1200px;border-radius:50%;border:20px solid var(--g);display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;animation:pulse 4s ease-in-out infinite}.ring:before{content:'';position:absolute;width:1300px;height:1300px;border-radius:50%;border:2px solid rgba(0,255,106,.18)}.ring:after{content:'';position:absolute;width:1040px;height:1040px;border-radius:50%;border:2px solid rgba(0,255,106,.18)}@keyframes pulse{0%,100%{box-shadow:0 0 80px rgba(0,255,106,.35),0 0 180px rgba(0,255,106,.25)}50%{box-shadow:0 0 220px rgba(0,255,106,1),0 0 420px rgba(0,255,106,.8)}}.days{font-size:420px;font-weight:900;line-height:.85}.label{font-size:90px;color:var(--g);font-weight:800;letter-spacing:6px}.right{display:flex;align-items:center;padding-right:60px}.cards{width:100%;display:flex;flex-direction:column;gap:35px}.card{background:rgba(19,32,43,.92);border:2px solid rgba(255,255,255,.08);box-shadow:0 15px 40px rgba(0,0,0,.45),0 0 30px rgba(0,255,106,.12);border-radius:30px;padding:40px}.t{font-size:32px;color:#b8c7d6}.v{font-size:110px;font-weight:800}.small{font-size:72px}.goal{color:var(--g)}.progress{font-size:34px;color:#b8c7d6;margin-top:10px}.footer{position:absolute;bottom:35px;width:100%;text-align:center;color:var(--g);font-size:72px;font-weight:900;letter-spacing:4px;z-index:2}</style></head><body><img src="rhi.png" class="watermark"><div class="header"><h1>SAFETY DASHBOARD</h1><p>FORMENBAU HOLZ</p></div><div id="clock" class="clock"></div><div class="main"><div class="left"><div class="ring"><div id="days" class="days">0</div><div class="label">TAGE UNFALLFREI</div></div></div><div class="right"><div class="cards"><div class="card"><div class="t">SMS-MELDUNGEN</div><div id="smsCount" class="v">-</div></div><div class="card"><div class="t">LETZTER UNFALL</div><div class="v small">01.06.2018</div></div><div class="card"><div class="t">NÄCHSTES ZIEL</div><div class="v goal">4.000</div><div id="goalProgress" class="progress"></div></div></div></div></div><div class="footer">UNSERE VISION IST 100% UNFALLFREIHEIT</div><script>const accidentDate=new Date('2018-06-01');const goal=4000;function upd(){const d=Math.floor((new Date()-accidentDate)/86400000);days.innerText=d.toLocaleString('de-DE');goalProgress.innerText=((d/goal)*100).toFixed(1)+'% erreicht';}function clk(){const n=new Date();clock.innerText=n.toLocaleDateString('de-DE')+' | '+n.toLocaleTimeString('de-DE');}async function sms(){try{const r=await fetch('sms.txt?t='+Date.now());smsCount.innerText=(await r.text()).trim();}catch(e){}}upd();clk();sms();setInterval(clk,1000);setInterval(upd,60000);setInterval(sms,300000);</script></body></html>
