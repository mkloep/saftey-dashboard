<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FORMENBAU HOLZ - Safety Dashboard</title>

<style>

:root{
    --green:#00ff66;
    --bg:#081018;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:radial-gradient(circle,#183040 0%,#081018 75%);
    color:white;
    height:100vh;
    overflow:hidden;
}

/* Raster */

body::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

    background-size:80px 80px;
}

/* Wasserzeichen */

.watermark{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:2200px;

    opacity:.12;

    z-index:0;

    pointer-events:none;
}

/* Header */

.header{

    position:absolute;

    top:40px;
    left:50px;

    z-index:5;
}

.header h1{

    font-size:90px;
}

.header p{

    font-size:38px;
    color:#b8c8d8;
}

/* Uhr */

#clock{

    position:absolute;

    top:50px;
    right:50px;

    font-size:62px;
    font-weight:700;

    z-index:5;
}

/* Layout */

.container{

    display:grid;

    grid-template-columns:70% 30%;

    height:100vh;

    position:relative;

    z-index:2;
}

/* Ring */

.left{

    display:flex;
    justify-content:center;
    align-items:center;
}

.ring{

    width:1150px;
    height:1150px;

    border-radius:50%;
    border:20px solid var(--green);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;

    animation:pulse 4s ease infinite;
}

.ring::before{

    content:'';

    position:absolute;

    width:1280px;
    height:1280px;

    border-radius:50%;

    border:2px solid rgba(0,255,102,.15);
}

.ring::after{

    content:'';

    position:absolute;

    width:980px;
    height:980px;

    border-radius:50%;

    border:2px solid rgba(0,255,102,.15);
}

@keyframes pulse{

    0%,100%{
        box-shadow:
        0 0 70px rgba(0,255,102,.4),
        0 0 180px rgba(0,255,102,.25);
    }

    50%{
        box-shadow:
        0 0 250px rgba(0,255,102,1),
        0 0 450px rgba(0,255,102,.8);
    }
}

/* Tage */

.days{

    font-size:480px;
    font-weight:900;
    line-height:.85;
}

.label{

    font-size:110px;
    color:var(--green);
    font-weight:800;
}

/* Rechte Seite */

.right{

    display:flex;
    align-items:center;

    padding-right:60px;
}

.cards{

    width:100%;

    display:flex;
    flex-direction:column;
    gap:30px;
}

.card{

    background:rgba(18,30,40,.90);

    border-radius:28px;

    padding:40px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

.card-title{

    font-size:34px;
    color:#b8c8d8;
}

.card-value{

    font-size:140px;
    font-weight:800;
}

.card-date{

    font-size:90px;
}

.goal{

    color:var(--green);
}

/* Footer */

.footer{

    position:absolute;

    bottom:40px;

    width:100%;

    text-align:center;

    font-size:82px;

    font-weight:900;

    color:var(--green);

    z-index:5;
}

</style>
</head>

<body>

<img src="rhi.png" class="watermark">

<div class="header">
    <h1>SAFETY DASHBOARD</h1>
    <p>FORMENBAU HOLZ</p>
</div>

<div id="clock"></div>

<div class="container">

    <div class="left">

        <div class="ring">

            <div class="days" id="days">0</div>

            <div class="label">
                TAGE UNFALLFREI
            </div>

        </div>

    </div>

    <div class="right">

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    SMS-MELDUNGEN
                </div>

                <div class="card-value" id="smsCount">
                    -
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    LETZTER UNFALL
                </div>

                <div class="card-value card-date">
                    01.06.2018
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    NÄCHSTES ZIEL
                </div>

                <div class="card-value goal">
                    4.000
                </div>

            </div>

        </div>

    </div>

</div>

<div class="footer">
UNSERE VISION IST 100% UNFALLFREIHEIT
</div>

<script>

const accidentDate =
new Date("2018-06-01");

function updateDays(){

    const days =
    Math.floor(
    (new Date() - accidentDate)
    / 86400000
    );

    document.getElementById("days")
    .innerText =
    days.toLocaleString("de-DE");
}

function updateClock(){

    const now =
    new Date();

    document.getElementById("clock")
    .innerText =
    now.toLocaleDateString("de-DE")
    + " | " +
    now.toLocaleTimeString("de-DE");
}

/* SMS Datei lesen */

async function loadSMS(){

    try{

        const response =
        await fetch(
        "sms.txt?v=" +
        Date.now()
        );

        const value =
        await response.text();

        document.getElementById(
        "smsCount"
        ).innerText =
        value.trim();
    }
    catch(e){

        document.getElementById(
        "smsCount"
        ).innerText =
        "-";
    }
}

updateDays();
updateClock();
loadSMS();

setInterval(updateClock,1000);
setInterval(updateDays,60000);
setInterval(loadSMS,300000);

</script>

</body>
</
