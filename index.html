<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FORMENBAU HOLZ - Safety Dashboard</title>

<style>

:root{
    --green:#00ff6a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Segoe UI, Arial, sans-serif;
    background:
    radial-gradient(circle at center,
    #183040 0%,
    #081018 75%);
    color:white;
}

/* Raster */

body::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size:80px 80px;
}

/* LOGO */

.watermark{
    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:2200px;

    opacity:.12;

    z-index:0;
}

/* HEADER */

.header{
    position:absolute;
    top:40px;
    left:50px;
    z-index:5;
}

.header h1{
    font-size:90px;
}

.header p{
    font-size:40px;
    color:#b9c8d7;
}

/* UHR */

.clock{
    position:absolute;
    right:50px;
    top:50px;

    font-size:60px;
    font-weight:700;

    z-index:5;
}

/* LAYOUT */

.container{
    width:100%;
    height:100%;

    display:grid;
    grid-template-columns:68% 32%;

    position:relative;
    z-index:2;
}

/* LINKS */

.left{
    display:flex;
    justify-content:center;
    align-items:center;
}

.ring{

    width:1200px;
    height:1200px;

    border-radius:50%;
    border:20px solid var(--green);

    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    animation:pulse 4s infinite;
}

.ring::before{
    content:'';

    position:absolute;

    width:1320px;
    height:1320px;

    border-radius:50%;

    border:2px solid rgba(0,255,106,.15);
}

.ring::after{

    content:'';

    position:absolute;

    width:1020px;
    height:1020px;

    border-radius:50%;

    border:2px solid rgba(0,255,106,.15);
}

@keyframes pulse{

    0%,100%{
        box-shadow:
        0 0 60px rgba(0,255,106,.35),
        0 0 180px rgba(0,255,106,.25);
    }

    50%{
        box-shadow:
        0 0 240px rgba(0,255,106,.95),
        0 0 450px rgba(0,255,106,.75);
    }
}

.days{
    font-size:500px;
    font-weight:900;
    line-height:.85;
}

.label{
    font-size:120px;
    font-weight:800;
    color:var(--green);
}

/* RECHTS */

.right{
    display:flex;
    align-items:center;
    padding-right:60px;
}

.cards{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:30px;
}

.card{

    background:rgba(19,32,43,.92);

    border-radius:30px;

    padding:40px;

    border:2px solid rgba(255,255,255,.08);

    box-shadow:
    0 15px 40px rgba(0,0,0,.45);
}

.card-title{
    font-size:34px;
    color:#b9c8d7;
}

.card-value{
    font-size:140px;
    font-weight:800;
}

.card-date{
    font-size:95px;
}

.goal{
    color:var(--green);
}

/* FOOTER */

.footer{

    position:absolute;

    bottom:40px;

    width:100%;

    text-align:center;

    color:var(--green);

    font-size:100px;

    font-weight:900;

    text-transform:uppercase;

    z-index:5;
}

</style>
</head>

<body>

<img src="rhi.png" class="watermark">

<div class="header">
    <h1>SAFETY DASHBOARD</h1>
    <p>FORMENBAU HOLZ</p>
</div>

<div class="clock" id="clock"></div>

<div class="container">

    <div class="left">

        <div class="ring">

            <div class="days" id="days">0</div>

            <div class="label">
                TAGE UNFALLFREI
            </div>

        </div>

    </div>

    <div class="right">

        <div class="cards">

            <div class="card">
                <div class="card-title">
                    SMS-MELDUNGEN
                </div>

                <div class="card-value">
                    37
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    LETZTER UNFALL
                </div>

                <div class="card-value card-date">
                    01.06.2018
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    NÄCHSTES ZIEL
                </div>

                <div class="card-value goal">
                    4.000
                </div>
            </div>

        </div>

    </div>

</div>

<div class="footer">
    UNSERE
