<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHI Magnesita Safety Dashboard</title>
<style>
:root{--green:#00ff6a;--bg:#081018;--panel:#13202b}
*{box-sizing:border-box} body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle,#142432,#081018 70%);color:#fff;font-family:Segoe UI,Arial,sans-serif}
body:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:80px 80px}
.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1700px;opacity:.06;z-index:0}
.header{position:absolute;left:50px;top:30px;z-index:2}.header h1{margin:0;font-size:58px}.header p{margin:5px 0;color:#9eb4c9}
#clock{position:absolute;right:50px;top:40px;font-size:40px;z-index:2}
.main{height:100vh;display:grid;grid-template-columns:68% 32%;position:relative;z-index:2}
.left{display:flex;justify-content:center;align-items:center}
.ring{width:1050px;height:1050px;border-radius:50%;border:18px solid var(--green);display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;animation:pulse 4s infinite}
.ring:before,.ring:after{content:'';position:absolute;border-radius:50%;border:2px solid rgba(0,255,106,.15)}
.ring:before{width:1150px;height:1150px}.ring:after{width:930px;height:930px}
@keyframes pulse{0%,100%{box-shadow:0 0 50px rgba(0,255,106,.4),0 0 120px rgba(0,255,106,.25)}50%{box-shadow:0 0 170px rgba(0,255,106,1),0 0 320px rgba(0,255,106,.7)}}
.days{font-size:340px;font-weight:900;line-height:.9}.label{font-size:76px;color:var(--green);font-weight:800;letter-spacing:6px}
.right{display:flex;align-items:center;padding-right:50px}.cards{width:100%;display:flex;flex-direction:column;gap:30px}
.card{background:rgba(19,32,43,.95);border-radius:24px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.t{font-size:30px;color:#9eb4c9}.v{font-size:110px;font-weight:800}.small{font-size:70px}.goal{color:var(--green)}
.footer{position:absolute;bottom:25px;width:100%;text-align:center;font-size:34px;color:var(--green);letter-spacing:4px;z-index:2}
</style>
</head>
<body>
<img class="watermark" src="rhi.png" alt="RHI">
<div class="header"><h1>SAFETY DASHBOARD</h1><p>RHI MAGNESITA</p></div>
<div id="clock"></div>
<div class="main">
<div class="left"><div class="ring"><div id="days" class="days">0</div><div class="label">TAGE UNFALLFREI</div></div></div>
<div class="right"><div class="cards">
<div class="card"><div class="t">SMS-MELDUNGEN</div><div class="v" id="smsCount">-</div></div>
<div class="card"><div class="t">LETZTER UNFALL</div><div class="v small">01.06.2018</div></div>
<div class="card"><div class="t">NÄCHSTES ZIEL</div><div class="v goal">4.000</div></div>
</div></div></div>
<div class="footer">SICHERHEIT BEGINNT MIT AUFMERKSAMKEIT</div>
<script>
const accidentDate=new Date('2018-06-01');
function updateDays(){document.getElementById('days').innerText=Math.floor((new Date()-accidentDate)/86400000).toLocaleString('de-DE');}
function updateClock(){const n=new Date();clock.innerText=n.toLocaleDateString('de-DE')+' | '+n.toLocaleTimeString('de-DE');}
async function loadSMS(){try{const r=await fetch('sms.txt?t='+Date.now());smsCount.innerText=(await r.text()).trim();}catch(e){smsCount.innerText='37';}}
updateDays();updateClock();loadSMS();
setInterval(updateClock,1000);setInterval(updateDays,60000);setInterval(loadSMS,300000);
</script>
</body></html>
